- type: entity
  parent: RMCSentryOmni
  id: AU14SentryOmniWeYu
  name: WY 571-D omnidirectional sentry gun
  description: A Weyland-Yutani-configured 571-D sentry gun. Its locked corporate IFF recognizes Weyland-Yutani personnel, security, synthetics, contractors, and private military forces.
  components:
  - type: UserIFF
    factions:
    - FactionWEYU
  - type: EntityIFF
  - type: Tag
    tags:
    - RMCSentryWeYa
  # CMU14: full autocannon damage instead of the 0.7 corporate multiplier.
  - type: GunDamageModifier
    multiplier: 1
  # CMU14: 5.0 -> 8.0 detection range.
  - type: HTN
    blackboard:
      SoundTargetInLOS: !type:SoundPathSpecifier
        path: /Audio/Effects/double_beep.ogg
      VisionRadius: !type:Single
        8.0
      AggroVisionRadius: !type:Single
        8.0
  - type: SentryTargeting
    lockedFriendlyFactions:
    - AUWeYu
    - WeYa
    friendlyFactions:
    - AUWeYu
    - WeYa
    deployedFriendlyFactions:
    - AUWeYu
    - WeYa

