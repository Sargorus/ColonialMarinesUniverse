# CMU14: modular-grenade EMP charge unlocked by a robotics recipe cartridge.
- type: entity
  parent: [ BasePayload, BaseSecurityScienceCommandContraband ]
  id: CMUEmpPayload
  name: EMP payload
  description: A single-use electromagnetic payload. Disables electronics in a wide radius.
  components:
  - type: Sprite
    sprite: Objects/Devices/payload.rsi
    state: payload-flash-armed
    color: "#4aa3ff"
  - type: EmpOnTrigger
    range: 5.5
    energyConsumption: 50000
    disableDuration: 60
  - type: DeleteOnTrigger
  - type: StaticPrice
    price: 500
