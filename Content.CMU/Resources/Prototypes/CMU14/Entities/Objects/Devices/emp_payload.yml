# CMU14: modular-grenade EMP charge unlocked by a robotics recipe cartridge. It is not contraband:
# corporate security and colony engineers are expected to use it against hostile synthetics.
- type: entity
  parent: BasePayload
  id: CMUEmpPayload
  name: EMP payload
  description: A single-use electromagnetic payload. Disables electronics in a wide radius.
  components:
  - type: Sprite
    sprite: Objects/Devices/payload.rsi
    state: payload-flash-armed
    color: "#4aa3ff"
  - type: EmpOnTrigger
    range: 9
    energyConsumption: 80000
    disableDuration: 90
  - type: DeleteOnTrigger
  - type: StaticPrice
    price: 500
