- type: entity
  parent: RMCCommunicationsConsoleBase
  id: CMURoboticsOrderConsole
  name: robotics terminal
  description: A Weyland-Yutani robotics terminal. Accept build or repair orders, run SMO production-network contracts, or spend sample data on recipe cartridges. Orders expire after fifteen minutes.
  components:
  - type: Transform
    anchored: false
    noRot: false
  - type: Anchorable
    flags: [Anchorable, Unanchorable]
  - type: Rotatable
  - type: RemoveComponents
    components:
    - type: WallMount
  - type: Sprite
    sprite: _RMC14/Structures/Machines/computer.rsi
    state: terminal1_old
  - type: InteractionOutline
  - type: CMURoboticsOrderConsole
    buildTargets:
    - prototype: CMUDroneAndroidUnarmed
      name: cmu-robotics-target-civilian-drone
      reward: 3500
      requiredModules:
      - CMUDroneModuleMedical
    repairTargets:
    - prototype: CMUDroneAndroidUnarmed
      name: cmu-robotics-target-civilian-drone
      reward: 2400
      repairPrototype: CMUDroneAndroidUnarmedRepairOrder
      requiredModules:
      - CMUDroneModuleMedical
    - prototype: CMUDroneAndroidCombat
      name: cmu-robotics-target-combat-drone
      reward: 2500
      repairPrototype: CMUDroneAndroidCombatRepairOrder
      requiredModules:
      - CMUDroneModuleCombat
      - CMUDroneModuleMedical
    - prototype: CMUWorkingJoeRepair
      name: cmu-robotics-target-working-joe
      reward: 2050
      repairPrototype: CMUWorkingJoeRepairOrder
      workingJoe: true
      outfits:
      - equipment:
          jumpsuit: CMJumpsuitAverageJoe
          shoes: CMBootsBlack
          gloves: CMHandsBlackInsulated
      - equipment:
          jumpsuit: CMJumpsuitAverageJoe
          shoes: AU14BootsUSArmy
          gloves: CMHandsBlackInsulated
      - equipment:
          jumpsuit: AU14JoeHazmat
          shoes: AU14BootsCBRN
          head: RMCHoodBioGeneral
          gloves: RMCHandsVeteranCBRN
      - equipment:
          jumpsuit: CMJumpsuitAverageJoe
          shoes: RMCShoesTychoBoots
          head: RMCHeadTychoRadiationHood
          gloves: RMCHandsTychoGloves
          outerClothing: RMCSuitTychoRadiationSuit
      - equipment:
          jumpsuit: CMJumpsuitAverageJoe
          shoes: AU14BootsCBRN
          head: RMCHoodBioGeneral
          gloves: RMCHandsVeteranCBRN
          outerClothing: AU14SuitBioWeYu
      - equipment:
          jumpsuit: CMJumpsuitAverageJoe
          shoes: AU14BootsCBRN
          head: RMCHoodBioGeneral
          gloves: RMCHandsVeteranCBRN
          outerClothing: CMUSuitBioWYSec
      - equipment:
          jumpsuit: CMJumpsuitSyntheticOutdated
          shoes: RMCShoesBlack
          gloves: CMHandsBlackInsulated
    cartridges:
    - cartridge: CMURoboticsCartridgeEmp
      description: cmu-robotics-cartridge-emp-desc
      cost: 3
    - cartridge: CMURoboticsCartridgeProgramSystem
      description: cmu-robotics-cartridge-program-system-desc
      cost: 5
    - cartridge: CMURoboticsCartridgeCombatSystem
      description: cmu-robotics-cartridge-combat-system-desc
      cost: 8
    - cartridge: CMURoboticsCartridgeModularMine
      description: cmu-robotics-cartridge-modular-mine-desc
      cost: 3
  - type: CMUQueueNetworkConsole
  - type: ActivatableUI
    key: enum.CMURoboticsOrderConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["AU14AccessCorporateWEYU"]]
  - type: UserInterface
    interfaces:
      enum.CMURoboticsOrderConsoleUiKey.Key:
        type: CMURoboticsOrderConsoleBoundUserInterface
  - type: StaticPrice
    price: 100
